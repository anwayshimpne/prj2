<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Evaluation</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 860px; margin: auto; }
    h1 { margin: 0 0 8px; }
    .intro { color: #536176; margin: 0 0 24px; }
    .panel { background: white; border: 1px solid #dce3ee; border-radius: 12px; padding: 24px; margin: 16px 0; box-shadow: 0 4px 16px #1720330b; }
    label { display: block; font-weight: 650; margin: 14px 0 7px; }
    select { width: 100%; padding: 11px 12px; border: 1px solid #b9c5d6; border-radius: 7px; background: white; font: inherit; }
    .muted { color: #637188; }
    .status { min-height: 1.5em; color: #a32626; margin-top: 12px; }
    .offers { display: grid; gap: 12px; margin-top: 16px; }
    .offer { border: 1px solid #dce3ee; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .offer h3 { font-size: 1rem; margin: 0 0 4px; }
    .price { color: #12633b; font-size: 1.1rem; font-weight: 700; white-space: nowrap; }
    @media (max-width: 540px) { body { padding: 20px 12px; } .panel { padding: 17px; } .offer { align-items: flex-start; flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <h1>Dealer Evaluation</h1>
    <p class="intro">Compare dealer offers and find the best price for a product.</p>
    <section class="panel" aria-labelledby="product-heading">
      <h2 id="product-heading">Choose a product</h2>
      <label for="product-select">Product</label>
      <select id="product-select"><option value="">Loading products…</option></select>
      <div id="product-info" class="muted" aria-live="polite"></div>
      <div id="product-status" class="status" role="status"></div>
    </section>
    <section class="panel" aria-labelledby="dealer-heading">
      <h2 id="dealer-heading">Dealer offers</h2>
      <label for="dealer-select">Dealer</label>
      <select id="dealer-select" disabled><option value="">Select a product first</option></select>
      <div id="dealer-status" class="status" role="status"></div>
      <div id="offers" class="offers" aria-live="polite"></div>
    </section>
  </main>
  <script>
    // Replace both placeholders with the public Code Engine service URLs before deploying.
    const PRODUCT_DETAILS_API_URL = 'PRODUCT_DETAILS_API_URL';
    const DEALER_PRICING_API_URL = 'DEALER_PRICING_API_URL';

    const productSelect = document.getElementById('product-select');
    const dealerSelect = document.getElementById('dealer-select');
    const productInfo = document.getElementById('product-info');
    const productStatus = document.getElementById('product-status');
    const dealerStatus = document.getElementById('dealer-status');
    const offersElement = document.getElementById('offers');
    let dealers = [];

    function apiUrl(base, path) {
      if (!base || base.includes('_API_URL')) throw new Error('Set the API URL placeholders in frontend/index.html before deploying.');
      return `${base.replace(/\/$/, '')}${path}`;
    }

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Request failed (${response.status})`);
      return response.json();
    }

    function money(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
    }

    function showOffers(selectedId) {
      offersElement.replaceChildren();
      const selected = selectedId === 'all' ? dealers : dealers.filter(dealer => dealer.id === selectedId);
      if (selected.length === 0) return;
      for (const dealer of selected) {
        const card = document.createElement('article');
        card.className = 'offer';
        const details = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = dealer.name;
        const location = document.createElement('span');
        location.className = 'muted';
        location.textContent = dealer.location;
        details.append(title, location);
        const price = document.createElement('span');
        price.className = 'price';
        price.textContent = money(dealer.price);
        card.append(details, price);
        offersElement.append(card);
      }
    }

    async function loadProducts() {
      try {
        const products = await getJson(apiUrl(PRODUCT_DETAILS_API_URL, '/api/products'));
        productSelect.replaceChildren(new Option('Select a product', ''));
        for (const product of products) productSelect.add(new Option(product.name, product.id));
        productStatus.textContent = '';
      } catch (error) {
        productSelect.replaceChildren(new Option('Products unavailable', ''));
        productStatus.textContent = error.message;
      }
    }

    async function loadDealers(productId) {
      dealers = [];
      offersElement.replaceChildren();
      dealerStatus.textContent = '';
      if (!productId) {
        dealerSelect.disabled = true;
        dealerSelect.replaceChildren(new Option('Select a product first', ''));
        productInfo.textContent = '';
        return;
      }
      try {
        const [product, results] = await Promise.all([
          getJson(apiUrl(PRODUCT_DETAILS_API_URL, `/api/products/${encodeURIComponent(productId)}`)),
          getJson(apiUrl(DEALER_PRICING_API_URL, `/api/dealers?product_id=${encodeURIComponent(productId)}`)),
        ]);
        productInfo.textContent = `${product.description} · List price ${money(product.price)}`;
        dealers = results;
        dealerSelect.disabled = dealers.length === 0;
        dealerSelect.replaceChildren(new Option(dealers.length ? 'Select a dealer' : 'No dealers found', ''));
        if (dealers.length) dealerSelect.add(new Option('All dealers', 'all'));
        for (const dealer of dealers) dealerSelect.add(new Option(dealer.name, dealer.id));
        if (!dealers.length) dealerStatus.textContent = 'No dealers currently offer this product.';
      } catch (error) {
        dealerSelect.disabled = true;
        dealerSelect.replaceChildren(new Option('Dealer offers unavailable', ''));
        dealerStatus.textContent = error.message;
      }
    }

    productSelect.addEventListener('change', event => {
      dealerSelect.value = '';
      loadDealers(event.target.value);
    });
    dealerSelect.addEventListener('change', event => showOffers(event.target.value));
    loadProducts();
  </script>
</body>
</html>
